# Builds the Windows and macOS installers and publishes them to a GitHub
# Release whenever a version tag (v*) is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Remember to bump "version" in package.json to match the tag first.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10 (bundled with Node 22) hits a workspace bug; see README.
      - run: npm install -g npm@11

      # postinstall builds the vendored Sign in with ChatGPT DevKit workspaces.
      - run: npm ci

      - run: npm run build

      - name: Package and publish
        run: npx electron-builder ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
