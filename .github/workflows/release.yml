# Builds the Windows and macOS installers and publishes them to a GitHub
# Release whenever a version tag (v*) is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Remember to bump "version" in package.json to match the tag first.
#
# The build jobs only build. A single release job then publishes everything,
# because parallel jobs creating the same release race and produce duplicates.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm 10 (bundled with Node 22) hits a workspace bug; see README.
      - run: npm install -g npm@11

      # postinstall builds the vendored Sign in with ChatGPT DevKit workspaces.
      - run: npm ci

      # The Aptabase key comes from a repository secret so it stays out of the
      # source. Without the secret the build simply ships with analytics off.
      - run: npm run build
        env:
          MAIN_VITE_APTABASE_KEY: ${{ secrets.APTABASE_APP_KEY }}

      - name: Package
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## Download

            - **Windows:** `Exee-AI-Setup-x64.exe` (installer) or `Exee-AI-Portable-x64.exe` (no install)
            - **macOS (Intel + Apple Silicon):** `Exee-AI-mac-universal.dmg`

            These builds aren't code-signed yet, so the first launch shows a warning:
            - **Windows SmartScreen:** *More info* → *Run anyway*
            - **macOS:** right-click Exee AI in Applications → *Open* → *Open*
