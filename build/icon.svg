<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Exetasy app icon.

    The mark is the same hexagonal prism used by the in-app Logo component
    (icons.tsx, "logo"): an outer shell with an inner core, reading as a
    faceted gem. Set on the brand gradient from styles.css.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="core" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.62" />
    </linearGradient>

    <filter id="softshadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- squircle plate -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bg)" />
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#sheen)" />

  <!-- ambient orbs, echoing the hero card -->
  <circle cx="430" cy="86" r="104" fill="#ffffff" opacity="0.10" />
  <circle cx="92" cy="438" r="78" fill="#ffffff" opacity="0.07" />

  <g filter="url(#softshadow)">
    <!-- outer prism -->
    <path
      d="M256 92 L408 170 L408 342 L256 420 L104 342 L104 170 Z"
      fill="none"
      stroke="#ffffff"
      stroke-width="26"
      stroke-linejoin="round"
    />
    <!-- inner core -->
    <path
      d="M256 170 L342 214 L342 298 L256 342 L170 298 L170 214 Z"
      fill="url(#core)"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linejoin="round"
    />
  </g>
</svg>
