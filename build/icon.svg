<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Exee AI app icon: an exam sheet on the desk, marked with the red pen.
    The same objects as the website and the in-app exam paper. Plain shapes
    only, so scripts/make-icons.mjs renders it without any fonts.
  -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="#1b2338" />

  <!-- the sheet -->
  <rect x="128" y="88" width="256" height="336" rx="12" fill="#f5f3ee" />

  <!-- heading and ruled answer lines, in ink -->
  <rect x="164" y="128" width="124" height="24" rx="5" fill="#141a2b" />
  <rect x="164" y="186" width="184" height="14" rx="7" fill="#c6c9d2" />
  <rect x="164" y="222" width="184" height="14" rx="7" fill="#c6c9d2" />
  <rect x="164" y="258" width="128" height="14" rx="7" fill="#c6c9d2" />

  <!-- the red-pen tick -->
  <path d="M184 336 L228 376 L330 284" fill="none" stroke="#d0302a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
</svg>
