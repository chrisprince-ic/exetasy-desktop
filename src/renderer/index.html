<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No remote origins anywhere: everything is served from the bundle.

      'wasm-unsafe-eval' and blob: are required by Tesseract — it instantiates
      a WebAssembly module and spawns its worker from a blob URL. They allow
      WASM and local workers; they do not permit loading anything over the
      network, which `default-src 'none'` continues to forbid.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self' 'wasm-unsafe-eval' blob:;
               worker-src 'self' blob:;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self' data:;
               connect-src 'self' data: blob:"
    />
    <title>Exee AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
